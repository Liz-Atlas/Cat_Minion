<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Minion</title>
<meta name="description" content="Cat Minion – Einmal falsch geatmet, schon enterbt. Ein 24-Stunden-Überlebensspiel als Personal zweier Senioren-Katzen.">
<style>
  :root{
    --bg:#141218; --card:#1f1b26; --card2:#29243300; --line:#3a3346;
    --text:#ece6f2; --muted:#a79fb3; --pink:#f3a9c6; --gold:#e8c27a;
    --green:#8fd3a8; --red:#ef7b7b; --blue:#8ab4f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;min-height:100vh;
    background-image:radial-gradient(circle at 20% 0%,#2a1f33 0,transparent 45%),radial-gradient(circle at 100% 100%,#1d2430 0,transparent 40%)}
  .wrap{max-width:620px;margin:0 auto;padding:16px 16px 48px}
  header{text-align:center;padding:12px 0 8px}
  h1{font-size:2rem;letter-spacing:.04em}
  h1 span{color:var(--pink)}
  .tag{color:var(--muted);font-style:italic;font-size:.95rem}

  .cockpit{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:14px 0;position:sticky;top:8px;z-index:5;box-shadow:0 8px 24px #0006}
  .bar{margin-bottom:10px}
  .bar-head{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px}
  .track{height:10px;background:#0d0b10;border-radius:99px;overflow:hidden}
  .fill{height:100%;border-radius:99px;transition:width .6s ease,background .6s}
  .slipper{display:flex;justify-content:space-between;font-size:.88rem;padding-top:4px;border-top:1px dashed var(--line);margin-top:4px}
  .slipper b{color:var(--gold)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;animation:in .35s ease}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .meta{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .time{font-family:ui-monospace,Menlo,monospace;color:var(--gold);font-size:.95rem}
  .cats{display:flex;gap:6px}
  .chip{font-size:.78rem;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
  h2{font-size:1.3rem;margin-bottom:10px}
  .situation{color:#d8d0e2;margin-bottom:18px}
  .boss{color:var(--red);font-weight:700;font-size:.8rem;letter-spacing:.12em}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;border:1px solid var(--line);background:#17141d;transition:border-color .2s,transform .1s}
  .opt:hover{border-color:var(--pink)}
  .opt:active{transform:scale(.99)}
  .opt .k{flex:0 0 28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#2c2537;color:var(--pink);font-weight:700}

  .pic{position:relative;width:100%;aspect-ratio:4/3;border-radius:14px;overflow:hidden;display:grid;place-items:center;margin-bottom:14px;border:1px solid var(--line)}
  .pic .emo{font-size:5.5rem;filter:drop-shadow(0 6px 12px #0008)}
  .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .pic.win{background:linear-gradient(135deg,#3a2438,#2a2033)}
  .pic.fail{background:linear-gradient(135deg,#3a1f24,#1f1b26)}
  .pic.ok{background:linear-gradient(135deg,#22303a,#1f1b26)}
  .caption{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;background:linear-gradient(transparent,#000c);font-size:.85rem;color:#fff;text-align:left}
  .verdict{font-size:1.25rem;font-weight:800;margin-bottom:6px}
  .verdict.win{color:var(--green)} .verdict.fail{color:var(--red)} .verdict.ok{color:var(--blue)}
  .deltas{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .d{font-size:.82rem;padding:3px 9px;border-radius:99px;background:#17141d;border:1px solid var(--line)}
  .d.plus{color:var(--green)} .d.minus{color:var(--red)}
  .report{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:14px}
  .report h3{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:10px 14px;background:#17141d}
  .row{padding:10px 14px;border-top:1px solid var(--line)}
  .row small{display:block;color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
  .fact{background:#1a2420;color:#cfe8da}
  .whim{background:#2b1f2a;border:1px dashed var(--pink);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:.9rem}
  .btn{all:unset;cursor:pointer;display:block;text-align:center;width:100%;padding:14px;border-radius:14px;background:var(--pink);color:#1a1020;font-weight:800;box-sizing:border-box}
  .btn:hover{filter:brightness(1.08)}
  .btn.ghost{background:transparent;color:var(--pink);border:1px solid var(--pink);margin-top:10px}
  .intro p{margin-bottom:12px;color:#d8d0e2}
  .profiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0}
  .prof{background:#17141d;border:1px solid var(--line);border-radius:14px;padding:12px;font-size:.85rem}
  .prof b{display:block;margin-bottom:4px}
  .log{list-style:none;margin:14px 0}
  .log li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
  footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:24px}
  @media (max-width:420px){.profiles{grid-template-columns:1fr}h1{font-size:1.7rem}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>CAT <span>MINION</span></h1>
    <p class="tag">Einmal falsch geatmet, schon enterbt.</p>
  </header>

  <section class="cockpit" id="cockpit" hidden>
    <div class="bar">
      <div class="bar-head"><span>👑 Pinkey-Würde</span><span id="pv">50 %</span></div>
      <div class="track"><div class="fill" id="pb"></div></div>
    </div>
    <div class="bar">
      <div class="bar-head"><span>🧶 Puma-Sicherheit</span><span id="uv">50 %</span></div>
      <div class="track"><div class="fill" id="ub"></div></div>
    </div>
    <div class="slipper"><span>🧦 Hausschuhe</span><b id="sv">Trocken &amp; geduldet</b></div>
  </section>

  <main id="stage"></main>
  <footer>Ein Fun-Projekt. Keine Katze wurde beim Entwickeln gezwungen. Der Minion schon.</footer>
</div>

const QUIZ_LEN = 10;
const QZ = { list:[], i:0, score:0, log:[] };
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function picHTML(im, cls){
  return `<div class="pic ${cls}"><span class="emo">${im.emo}</span>${im.src ? `<img src="${im.src}" alt="" style="object-position:${im.pos||"center"}" onerror="this.remove()">` : ""}<div class="caption">${esc(im.caption||"")}</div></div>`;
}

function quizStart(){
  $("cockpit").hidden = true;
  QZ.list = shuffle(QUIZ.slice()).slice(0, QUIZ_LEN).map(x => ({...x, opts: shuffle(x.opts.slice())}));
  QZ.i = 0; QZ.score = 0; QZ.log = [];
  quizQuestion();
}

function quizQuestion(){
  const x = QZ.list[QZ.i];
  stage.innerHTML = `
  <div class="card">
    <div class="meta"><span class="time">📚 Minion-Prüfung · ${QZ.i+1}/${QZ.list.length}</span><span class="chip">🐾 ${QZ.score} Gnade</span></div>
    <h2>${esc(x.q)}</h2>
    <div class="opts">
      ${x.opts.map((o,n)=>`<button class="opt" onclick="quizAnswer(${n})"><span class="k">${"ABC"[n]}</span><span>${esc(o.t)}</span></button>`).join("")}
    </div>
  </div>`;
  top();
}

function quizAnswer(n){
  const x = QZ.list[QZ.i], o = x.opts[n], ok = !!o.ok;
  if (ok) QZ.score++;
  QZ.log.push({ title:x.q, type: ok ? "win" : "fail" });
  const right = x.opts.find(p => p.ok);
  const whim = ok && Math.random() < 0.1 ? WHIMS[Math.floor(Math.random()*WHIMS.length)] : null;
  const last = QZ.i >= QZ.list.length-1;
  stage.innerHTML = `
  <div class="card">
    ${picHTML(ok ? IMAGES.pfote : IMAGES.blick, ok ? "win" : "fail")}
    <div class="verdict ${ok?"win":"fail"}">${ok ? "Richtig. Gnade gewährt. 🐾" : "Falsch. Der Blick."}</div>
    ${whim ? `<div class="whim">🎲 <b>Willkür-Faktor:</b> ${whim} (zählt trotzdem.)</div>` : ""}
    <div class="report">
      <h3>Minion-Report</h3>
      ${ok ? "" : `<div class="row"><small>Richtig wäre</small>${esc(right.t)}</div>`}
      <div class="row"><small>Was die Katze denkt</small>${esc(x.cat)}</div>
      <div class="row fact"><small>Katzen-Fakt</small>${esc(x.fact)}</div>
    </div>
    <button class="btn" onclick="${last ? "quizFinish()" : "QZ.i++;quizQuestion()"}">${last ? "Prüfung abgeben" : "Nächste Frage"}</button>
  </div>`;
  top();
}

function quizFinish(){
  const s = QZ.score, n = QZ.list.length;
  let title, text, im, cls;
  if (s >= 9){ title="Diplom-Minion"; text="Du weißt mehr über Katzen als die meisten Katzen über dich wissen wollen."; im=IMAGES.pfote; cls="win"; }
  else if (s >= 6){ title="Minion mit Grundkenntnissen"; text="Solide. Die Katze ist nicht beeindruckt, aber sie ist nie beeindruckt."; im=IMAGES.blick; cls="ok"; }
  else { title="Dosenöffner, ungelernt"; text="Du darfst weiter Futter servieren. Mehr Verantwortung bekommst du vorerst nicht."; im=IMAGES.pantoffel; cls="fail"; }
  stage.innerHTML = `
  <div class="card">
    ${picHTML(im, cls)}
    <div class="verdict ${cls}">${title}</div>
    <p class="situation">${text}</p>
    <div class="deltas"><span class="d">🐾 ${s} von ${n} richtig</span></div>
    <button class="btn" onclick="quizStart()">Neue Prüfung (neue Fragen)</button>
    <button class="btn ghost" onclick="intro()">Zum Start</button>
  </div>`;
  top();
}

  // Willkür-Faktor
  let whim = null;
  if (o.type!=="fail" && Math.random() < (L.whimBoost ? 0.5 : 0.15)) {
    whim = WHIMS[Math.floor(Math.random()*WHIMS.length)];
    d.pinkey -= 2;
  }
  // Puma-Fails kosten Hausschuh-Status
  if (o.type==="fail" && L.cats.includes("puma") && d.puma<0 && !d.slipper) d.slipper = 1;

  S.pinkey = clamp(S.pinkey + d.pinkey);
  S.puma   = clamp(S.puma + d.puma);
  S.slipper= Math.min(SLIPPER.length-1, S.slipper + d.slipper);
  S.log.push({title:L.title, type:o.type});
  updateCockpit();

  const im = o.img ? IMAGES[o.img] : { emo:o.emo, caption:o.caption };
  const verdictTxt = { win:"Gnade gewährt. 🐾", ok:"Überlebt. Knapp.", fail:"Fehler im Muster." }[o.type];
  const dl = [];
  if (d.pinkey) dl.push(`<span class="d ${d.pinkey>0?"plus":"minus"}">👑 ${d.pinkey>0?"+":""}${d.pinkey}</span>`);
  if (d.puma)   dl.push(`<span class="d ${d.puma>0?"plus":"minus"}">🧶 ${d.puma>0?"+":""}${d.puma}</span>`);
  if (d.slipper)dl.push(`<span class="d minus">🧦 ${SLIPPER[S.slipper]}</span>`);

  const dead = S.pinkey<=0 || S.puma<=0;
  stage.innerHTML = `
  <div class="card">
    <div class="pic ${o.type}">
      <span class="emo">${im.emo}</span>
      ${im.src ? `<img src="${im.src}" alt="" style="object-position:${im.pos||"center"}" onerror="this.remove()">` : ""}
      <div class="caption">${esc(im.caption||"")}</div>
    </div>
    <div class="verdict ${o.type}">${verdictTxt}</div>
    <div class="deltas">${dl.join("")}</div>
    ${whim ? `<div class="whim">🎲 <b>Willkür-Faktor:</b> ${whim} (👑 −2)</div>` : ""}
    <div class="report">
      <h3>Minion-Report</h3>
      <div class="row"><small>Was du dachtest</small>${esc(o.thought)}</div>
      <div class="row"><small>Was die Katze denkt</small>${esc(o.cat)}</div>
      <div class="row fact"><small>Katzen-Fakt</small>${esc(o.fact)}</div>
    </div>
    <button class="btn" onclick="${dead ? "gameOver()" : (S.i<LEVELS.length-1 ? "next()" : "finish()")}">${dead ? "Oh nein." : (S.i<LEVELS.length-1 ? "Weiter im Dienst" : "Den Tag beenden")}</button>
  </div>`;
  top();
}

function next(){ S.i++; level(); }

function logList(){
  const ic = {win:"🐾",ok:"🚪",fail:"😾"};
  return `<ul class="log">${S.log.map(l=>`<li><span>${l.title}</span><span>${ic[l.type]}</span></li>`).join("")}</ul>`;
}

function gameOver(){
  const who = S.pinkey<=0 ? "pinkey" : "puma";
  const im = who==="pinkey" ? IMAGES.blick : IMAGES.pantoffel;
  stage.innerHTML = `
  <div class="card">
    <div class="pic fail"><span class="emo">${im.emo}</span><img src="${im.src}" alt="" style="object-position:${im.pos||"center"}" onerror="this.remove()"></div>
    <div class="verdict fail">GEKÜNDIGT.</div>
    <p class="situation">${who==="pinkey"
      ? "Pinkey hat dich offiziell enterbt. Sie wird dich weiterhin dulden – als Dosenöffner. Mehr nicht."
      : "Pumas Sicherheitssystem ist zusammengebrochen. Deine Hausschuhe haben es nicht geschafft."}</p>
    ${logList()}
    <button class="btn" onclick="start()">Neue Bewerbung einreichen</button>
    <button class="btn ghost" onclick="intro()">Zum Start</button>
  </div>`;
  top();
}

function finish(){
  const avg = (S.pinkey+S.puma)/2 - S.slipper*8;
  let title, text, img;
  if (avg>=75){ title="Ober-Minion mit Pfotenprivileg"; img=IMAGES.pfote;
    text="Beide Herrschaften sind zufrieden. Das wird nie wieder passieren. Genieß es."; }
  else if (avg>=45){ title="Minion auf Bewährung"; img=IMAGES.blick;
    text="Du darfst bleiben. Vorerst. Pinkey führt Buch, Puma vergibt – meistens."; }
  else { title="Enterbt, aber gefüttert ist gefüttert"; img=IMAGES.pantoffel;
    text="Du lebst noch. Deine Würde nicht. Die Hausschuhe gehen morgen in die Wäsche."; }
  stage.innerHTML = `
  <div class="card">
    <div class="pic ${avg>=75?"win":avg>=45?"ok":"fail"}"><span class="emo">${img.emo}</span><img src="${img.src}" alt="" style="object-position:${img.pos||"center"}" onerror="this.remove()"></div>
    <div class="verdict ${avg>=75?"win":avg>=45?"ok":"fail"}">${title}</div>
    <p class="situation">${text}</p>
    <div class="deltas">
      <span class="d">👑 ${S.pinkey} %</span><span class="d">🧶 ${S.puma} %</span><span class="d">🧦 ${SLIPPER[S.slipper]}</span>
    </div>
    ${logList()}
    <button class="btn" onclick="start()">Noch eine Schicht</button>
    <button class="btn ghost" onclick="quizStart()">📚 Zur Minion-Prüfung</button>
    <button class="btn ghost" onclick="intro()">Zum Start</button>
  </div>`;
  top();
}

intro();
</script>
</body>
</html>
